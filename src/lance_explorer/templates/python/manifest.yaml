templates:
  connect:
    file: connect.py.j2
    title: Connect to LanceDB
    language: python
    required_context: [database_uri]
  open_table:
    file: open_table.py.j2
    title: Open a Lance table
    language: python
    required_context: [table_uri, open_version]
  create_namespace_table:
    file: create_namespace_table.py.j2
    title: Create a table in a namespace
    language: python
    required_context: [namespace_root, namespace_path, table_name]
  insert_arrow_blobs:
    file: insert_arrow_blobs.py.j2
    title: Append Arrow rows with image blobs
    language: python
    required_context: [table_uri, open_version]
  insert_pandas:
    file: insert_pandas.py.j2
    title: Append a pandas DataFrame
    language: python
    required_context: [table_uri, open_version]
  insert_pydantic:
    file: insert_pydantic.py.j2
    title: Validate rows with Pydantic before append
    language: python
    required_context: [table_uri, open_version]
  schema_lance_model:
    file: schema_lance_model.py.j2
    title: Standalone LanceModel for the selected table
    language: python
    required_context: [model_source]
  merge_upsert:
    file: merge_upsert.py.j2
    title: Merge or upsert rows by key
    language: python
    required_context: [table_uri, open_version]
  update_rows:
    file: update_rows.py.j2
    title: Update rows with a SQL predicate
    language: python
    required_context: [table_uri, open_version]
  filter_query:
    file: filter_query.py.j2
    title: Run a filter query
    language: python
    required_context: [table_uri, columns, where, limit]
  fts_query:
    file: fts_query.py.j2
    title: Run a full-text query
    language: python
    required_context: [table_uri, text, column, columns, where, limit, fts_model_id, needs_language_model_home]
  hybrid_query:
    file: hybrid_query.py.j2
    title: Run a hybrid query
    language: python
    required_context: [table_uri, text, vector, vector_column, fts_column, columns, where, limit, rerank, fts_model_id, needs_language_model_home]
  vector_query:
    file: vector_query.py.j2
    title: Run a pasted-vector query
    language: python
    required_context: [table_uri, vector, column, columns, where, limit]
  compare_tables:
    file: compare_tables.py.j2
    title: Compare two Lance tables
    language: python
    required_context: [left_uri, right_uri, columns, key, limit, left_version, right_version]
  create_index:
    file: create_index.py.j2
    title: Create an index
    language: python
    required_context: [table_uri, column, index_type, config_class, config_options, needs_language_model_home, index_name, replace]
  drop_index:
    file: drop_index.py.j2
    title: Drop an index
    language: python
    required_context: [table_uri, index_name]
  optimize:
    file: optimize.py.j2
    title: Optimize a table
    language: python
    required_context: [table_uri, cleanup_days]
  cleanup_versions:
    file: cleanup_versions.py.j2
    title: Clean up old versions
    language: python
    required_context: [table_uri, older_than_days, delete_unverified]
  restore_version:
    file: restore_version.py.j2
    title: Restore a table version
    language: python
    required_context: [table_uri, version]
  drop_table:
    file: drop_table.py.j2
    title: Drop a table
    language: python
    required_context: [table_uri]
  scaling_spark:
    file: scaling_spark.py.j2
    title: Spark ingestion starter
    language: python
    required_context: [source_type, transformation_type, load_pattern, buffered_append_low, buffered_append_high, write_tasks, target_rows_per_fragment, include_max_batch_bytes, max_batch_bytes, write_mode, queued_write_buffer, queue_depth, has_fts, fts_segments, phrase_search_required, has_vector_index, vector_index_type, vector_segments, vector_partitions, pq_subvectors, vector_metric]
  scaling_trino:
    file: scaling_trino.sql.j2
    title: Trino ingestion starter
    language: sql
    required_context: [append_mode, transformation_type, load_pattern, buffered_append_low, buffered_append_high, include_target_rows_setting, target_rows_per_fragment]
  scaling_python:
    file: scaling_python.py.j2
    title: Python maintenance starter
    language: python
    required_context: [target_rows_per_fragment, recurring_load, load_pattern, has_indexes]
